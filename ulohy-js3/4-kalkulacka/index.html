<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulačka</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h1>Kalkulačka</h1>

  <section class="calculator">
    <div class="calc-row">
      <input type="text" id="result" class="result" readonly>
      <button type="button" id="clear">vymazať</button>
    </div>
    <div class="calc-row">
      <button type="button" class="button">7</button>
      <button type="button" class="button">8</button>
      <button type="button" class="button">9</button>
      <button type="button" class="operator">/</button>
    </div>
    <div class="calc-row">
      <button type="button" class="button">4</button>
      <button type="button" class="button">5</button>
      <button type="button" class="button">6</button>
      <button type="button" class="operator">*</button>
    </div>
    <div class="calc-row">
      <button type="button" class="button">1</button>
      <button type="button" class="button">2</button>
      <button type="button" class="button">3</button>
      <button type="button" class="operator">-</button>
    </div>
    <div class="calc-row">
      <button type="button" class="button">0</button>
      <button type="button" class="button">.</button>
      <button type="button" id="equals" class="equal-sign">=</button>
      <button type="button" class="operator">+</button>
    </div>
  </section>

  <!-- JavaScript si vytvor a pripoj sám -->
</body>
</html>
